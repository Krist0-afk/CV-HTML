<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Formulario de Contacto</h1>
    </header>
    
    <nav>
        <ul>
            <li><a href="index.html">Volver al Currículum</a></li>
        </ul>
    </nav>
    
    <section>
        <h2>Envíame un mensaje</h2>
        <form action="enviar_mensaje.php" method="POST">
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre" required>
            <br><br>

            <label for="email">Correo electrónico:</label>
            <input type="email" id="email" name="email" required>
            <br><br>

            <label for="telefono">Teléfono (opcional):</label>
            <input type="tel" id="telefono" name="telefono">
            <br><br>

            <label for="mensaje">Mensaje:</label>
            <textarea id="mensaje" name="mensaje" rows="4" required></textarea>
            <br><br>

            <label for="contacto">Preferencia de contacto:</label><br>
            <input type="radio" id="email_contacto" name="contacto" value="email" checked>
            <label for="email_contacto">Correo electrónico</label><br>
            <input type="radio" id="telefono_contacto" name="contacto" value="telefono">
            <label for="telefono_contacto">Teléfono</label><br>
            <br>

            <button type="submit">Enviar mensaje</button>
        </form>
    </section>
    
    <footer>
        <p>&copy; 2025 Cristobal Benjamin Valdebenito Paredes</p>
    </footer>
</body>
</html>
